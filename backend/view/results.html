<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuessME | My Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/quizStyle.css">
    <style>
        .results-container { padding: 40px; max-width: 1000px; margin: 0 auto; }
        .results-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .results-table th { background: #222; color: #b2ff59; padding: 15px; text-align: left; text-transform: uppercase; font-size: 12px; }
        .results-table td { padding: 15px; border-bottom: 1px solid #333; color: #fff; }
        
        /* Performance Badges */
        .badge-perf { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .perf-excellent { background: rgba(178, 255, 89, 0.2); color: #b2ff59; border: 1px solid #b2ff59; }
        .perf-good { background: rgba(33, 150, 243, 0.2); color: #2196f3; border: 1px solid #2196f3; }
        .perf-average { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }
        .perf-needs-work { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }
    </style>
</head>
<body class="dark-theme">

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-left"><h2><i class="fa-solid fa-bolt"></i> PERFORMANCE LOG</h2></div>
        <div class="nav-right">
            <button class="btn btn-back" onclick="window.location.href='quiz.html'">⬅ Back to Quiz</button>
        </div>
    </div>
</nav>

<div class="results-container">
    <div class="info-text">
        <h1>Your Achievements</h1>
        <p>Review your previous hacking assessments and scores.</p>
    </div>

    <table class="results-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Subject</th>
                <th>Score</th>
                <th>Performance</th>
            </tr>
        </thead>
        <tbody id="results-list">
            </tbody>
    </table>
</div>

<script>
async function fetchResults() {
    const token = localStorage.getItem("token");
    const listElement = document.getElementById('results-list');

    // 1. Security Check: If no token, they shouldn't be here
    if (!token) {
        alert("Please login to view results");
        window.location.href = 'login.html';
        return;
    }

    try {
        // 2. Fetch using PLURAL /api/results
        const response = await fetch('https://your-backend-name.onrender.com/api/results', {
            method: 'GET',
            headers: { 
                'Authorization': `Bearer ${token}` // Matches your auth.js middleware
            }
        });

        const data = await response.json();
        console.log("Data received from backend:", data); // Check your console!

        if (data.success && data.results.length > 0) {
            listElement.innerHTML = data.results.map(item => {
                // Ensure the CSS class matches your performance labels
                const perfClass = item.performance.toLowerCase().replace(/\s+/g, '-');
                const date = new Date(item.createdAt).toLocaleDateString('en-GB');

                return `
                    <tr>
                        <td>${date}</td>
                        <td><span style="color: #888; font-size: 0.8rem;">${item.technology}</span></td>
                        <td><strong>${item.subject}</strong></td>
                        <td>${item.score}%</td>
                        <td><span class="badge-perf perf-${perfClass}">${item.performance}</span></td>
                    </tr>
                `;
            }).join('');
        } else {
            listElement.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 50px;">No results found. Start a quiz to see your progress!</td></tr>`;
        }
    } catch (err) {
        console.error("Fetch Error:", err);
        listElement.innerHTML = `<tr><td colspan="5" style="text-align:center; color: red;">Server connection failed.</td></tr>`;
    }
}

// Run the function when the page loads
window.onload = fetchResults;

</script>
</body>
</html>
